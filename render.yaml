services:
  - type: web
    name: hammerdealer-single
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn hammerdealer_wrapper:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: HAMMERDEALER_API_KEY
        sync: false
      - key: PROXY_LIST
        sync: false
      # In Render-Dashboard: 1 Service Free -> Environment -> ebaga
      # die Keys nur hier eintragen, nicht ins Git.
      - key: EBAY_APP_ID
        sync: false
      - key: EBAY_CERT_ID
        sync: false
      - key: MIN_PROFIT
        value: 50
      - key: EBAY_APP_ID
        sync: false
      - key: EBAY_CERT_ID
        sync: false
      - key: EBAY_ENV
        value: production
    healthCheckPath: /api/health

