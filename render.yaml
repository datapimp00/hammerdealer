services:
  - type: web
    name: hammerdealer-single
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python3 -m playwright install --with-deps chromium || true
    startCommand: gunicorn hammerdealer_wrapper:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: HAMMERDEALER_API_KEY
        sync: false
      - key: PROXY_LIST
        sync: false
      # In Render-Dashboard: 1 Service Free -> Environment -> ebaga
      # die Keys nur hier eintragen, nicht ins Git.
      # Produktions-Konfiguration (Render → Environment):
      #   EBAY_APP_ID und EBAY_CERT_ID = deine Produktions-Schlüssel
      #   (nicht ins Git! Dort steht nur ein Platzhalter.) -> nachfolgend.
      - key: MIN_PROFIT
        value: 50
      - key: EBAY_APP_ID
        sync: false
      - key: EBAY_CERT_ID
        sync: false
      - key: EBAY_ENV
        value: production
      # Headless-Browser (willhaben). Wird STANDARDMASSIG NICHT genutzt: willhaben hat
      # Cloudflare, Chromium auf Render Free (512MB) ist riskant. Bei "1" wird's probiert
      # (bricht bei Cloudflare/fehlendem RAM sanglos auf kleinanzeigen+eBay zurueck).
      - key: HEADLESS
        value: "0"
      # Cache-TTL in Sekunden: 300 = Wiederhol-Scans 5 Min instant
      # (statt Neuscan bei jedem Aufruf). Neuere Preise? -> 60 setzen.
      - key: CACHE_TTL
        value: "300"
    healthCheckPath: /api/health

