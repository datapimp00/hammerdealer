<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A84FF" />
<title>2HEART · WG & Wohnungen Aggregator</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon.svg" />
<style>
  :root{--blue:#0A84FF;--bg:#F5F5F7;--dark:#0A0A0A;--line:rgba(0,0,0,.08);--txt:#1d1d1f;--muted:#6e6e73;--ok:#34C759;--radius:16px}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased;padding-top:max(12px,env(safe-area-inset-top));padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:1120px;margin:0 auto;padding:24px 20px 60px}
  header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:24px}
  .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px;letter-spacing:-.02em}
  .brand .logo{width:38px;height:38px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:16px}
  .tag{font-size:12px;color:var(--muted);font-weight:600}
  .admin{font-size:13px;font-weight:700;padding:10px 16px;border-radius:12px;background:var(--dark);color:#fff}
  h1{font-size:30px;margin:8px 0 4px;letter-spacing:-.03em}
  .lead{color:var(--muted);font-size:14px;margin-bottom:22px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  input[type=search],select,button{font:inherit}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:13px 14px 13px 40px;border:1px solid var(--line);border-radius:14px;background:#fff;outline:none}
  .search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.14)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4}
  select{padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700;cursor:pointer}
  .chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .15s ease,box-shadow .15s ease}
  .card:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(0,0,0,.08)}
  .card .ph{position:relative;height:160px;background:#eee}
  .card .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .card .ph .badge{position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(10,10,10,.75);color:#fff;backdrop-filter:blur(6px)}
  .card .body{padding:14px}
  .card .t{font-weight:800;font-size:15px;margin-bottom:4px;line-height:1.25}
  .card .m{color:var(--muted);font-size:12px}
  .card .row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
  .card .price{font-size:18px;font-weight:800}
  .wa{font-size:12px;font-weight:800;color:#25D366;background:rgba(37,211,102,.12);padding:6px 10px;border-radius:10px}
  .sortbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .sortbar button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .sortbar button.active{background:var(--dark);color:#fff;border-color:var(--dark)}
  .empty{padding:50px;text-align:center;color:var(--muted)}
  footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ok)}
  .live .blip{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:p 1.6s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(52,199,89,.5)}70%{box-shadow:0 0 0 8px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
  @media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:540px){.grid{grid-template-columns:1fr}h1{font-size:24px}}
  @media print{body{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="logo">2H</span> 2HEART</div>
    <div class="tag">6 Portale · <span class="live"><span class="blip"></span>live</span></div>
    <a class="admin" href="/admin">Admin</a>
  </header>

  <h1>WG & Wohnungen finden</h1>
  <div class="lead">Alle Angebote aus WG-Gesucht, Kleinanzeigen, ImmoScout, Facebook, WhatsApp & eBay — zentral aggregiert.</div>

  <div class="toolbar">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="q" type="search" placeholder="Titel, Stadt oder Portal suchen…" />
    </div>
    <select id="city">
      <option value="">Alle Städte</option>
      <option>Berlin</option><option>Hamburg</option><option>München</option><option>Köln</option><option>Frankfurt</option><option>Leipzig</option>
    </select>
    <select id="maxPrice">
      <option value="">Preis egal</option>
      <option value="500">bis 500 €</option>
      <option value="800">bis 800 €</option>
      <option value="1200">bis 1200 €</option>
    </select>
  </div>

  <div class="chips" id="chips"></div>

  <div class="sortbar">
    <span class="tag">Sortieren:</span>
    <button data-sort="price-asc">Preis ↑</button>
    <button data-sort="price-desc" class="active">Preis ↓</button>
    <button data-sort="new">Neueste</button>
  </div>

  <div class="grid" id="grid"></div>
  <footer>2HEART © <span id="yr"></span> · Live-Daten · <span id="cnt"></span></footer>
</div>
<script>
(function(){
  "use strict";
  document.getElementById("yr").textContent=new Date().getFullYear();
  const PORTALS=["wg-gesucht","kleinanzeigen","immoscout","facebook","whatsapp","ebay"];
  const CITIES=["Berlin","Hamburg","München","Köln","Frankfurt","Leipzig"];
  const WORDS=["Helles WG-Zimmer","Möblierte Wohnung","Studio mit Balkon","2er WG nahe Uni","Altbau-Charme","Neubau mit EBK","Günstiges Zimmer","Loft nahe Zentrum","Ruhige WG am Park","Dachgeschoss-Wohnung"];

  let data=[];
  function build(){
    data=[];
    for(let i=0;i<36;i++){
      const p=PORTALS[i%PORTALS.length];
      data.push({
        id:i, title:WORDS[i%WORDS.length]+" "+(i+1),
        price:350+((i*137)%950), city:CITIES[i%CITIES.length], portal:p,
        image:(i%2===0)?`https://i.pravatar.cc/300?img=${(i%70)+1}`:`https://picsum.photos/300/200?random=${i+1}`,
        ts:Date.now()-(i*3600000)
      });
    }
  }
  build();

  const state={q:"",city:"",max:"",portal:"",sort:"price-desc"};
  const $=id=>document.getElementById(id);
  const money=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);

  // chips
  const chips=$("chips");
  function renderChips(){
    const all=["",...PORTALS];
    chips.innerHTML=all.map(p=>`<button class="chip ${state.portal===p?'active':''}" data-p="${p}">${p||'Alle'}</button>`).join("");
    chips.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{state.portal=b.dataset.p;renderChips();render();});
  }

  function list(){
    let out=data.filter(r=>{
      const q=state.q.toLowerCase();
      return (!q||r.title.toLowerCase().includes(q)||r.city.toLowerCase().includes(q)||r.portal.includes(q))
        &&(!state.city||r.city===state.city)
        &&(!state.max||r.price<=Number(state.max))
        &&(!state.portal||r.portal===state.portal);
    });
    if(state.sort==="price-asc")out.sort((a,b)=>a.price-b.price);
    else if(state.sort==="price-desc")out.sort((a,b)=>b.price-a.price);
    else out.sort((a,b)=>a.ts-b.ts);
    return out;
  }

  function render(){
    const items=list();
    const g=$("grid");
    $("cnt").textContent=items.length+" Angebote";
    if(!items.length){g.innerHTML=`<div class="empty">Keine Angebote gefunden.</div>`;return;}
    g.innerHTML=items.map(r=>`
      <article class="card">
        <div class="ph"><span class="badge">${r.portal}</span><img loading="lazy" src="${r.image}" alt="" onerror="this.src='https://picsum.photos/300/200?random=1'"></div>
        <div class="body">
          <div class="t">${r.title}</div>
          <div class="m">${r.city} · WG</div>
          <div class="row"><span class="price">${money(r.price)}</span><span class="wa">WhatsApp</span></div>
        </div>
      </article>`).join("");
  }

  $("q").addEventListener("input",e=>{state.q=e.target.value;render();});
  $("city").addEventListener("change",e=>{state.city=e.target.value;render();});
  $("maxPrice").addEventListener("change",e=>{state.max=e.target.value;render();});
  document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{state.sort=b.dataset.sort;document.querySelectorAll("[data-sort]").forEach(x=>x.classList.remove("active"));b.classList.add("active");render();});

  // real-time simulation: occasionally add a fresh listing / jitter prices
  setInterval(()=>{
    const p=PORTALS[Math.floor(Math.random()*PORTALS.length)];
    const i=Math.floor(Math.random()*data.length);
    data[i].price=Math.max(300,data[i].price+(Math.floor(Math.random()*60)-30));
    if(Math.random()<0.25){ data.unshift({id:Date.now(),title:WORDS[Math.floor(Math.random()*WORDS.length)]+" NEU",price:350+Math.floor(Math.random()*950),city:CITIES[Math.floor(Math.random()*CITIES.length)],portal:p,image:`https://picsum.photos/300/200?random=${Math.floor(Math.random()*999)}`,ts:Date.now()}); if(data.length>80)data.pop(); }
    render();
  },5000);

  renderChips(); render();
})();
</script>
</body>
</html>
