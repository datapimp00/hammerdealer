<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>2HEART · 2FA</title>
<link rel="icon" href="/icon.svg" />
<style>
  :root{--blue:#0A84FF;--bg:#F5F5F7;--dark:#0A0A0A;--line:rgba(0,0,0,.08);--txt:#1d1d1f;--muted:#6e6e73;--ok:#34C759;--bad:#FF3B30;--radius:16px}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;background:var(--bg);color:var(--txt);padding-top:max(12px,env(safe-area-inset-top));padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
  .card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.08)}
  .lock{width:52px;height:52px;border-radius:14px;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:22px;margin-bottom:16px}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px}
  label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;outline:none}
  input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(10,132,255,.15)}
  .code{letter-spacing:.5em;text-align:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .btn{width:100%;margin-top:18px;padding:13px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;font-size:15px;cursor:pointer}
  .btn[disabled]{opacity:.6;cursor:default}
  .btn.ghost{background:#fff;color:var(--txt);border:1px solid var(--line);margin-top:10px}
  .msg{margin-top:14px;font-size:13px;font-weight:700;min-height:18px}
  .msg.ok{color:var(--ok)} .msg.err{color:var(--bad)}
  .secret{margin-top:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;background:#f5f5f7;padding:10px;border-radius:10px;display:none}
  a{color:var(--blue);text-decoration:none;font-size:12px}
  .foot{margin-top:16px;text-align:center}
  @media print{body{display:none}}
</style>
</head>
<body>
  <form class="card" id="f" autocomplete="off">
    <div class="lock">🔐</div>
    <h1>Zwei-Faktor-Authentifizierung</h1>
    <div class="sub">2HEART Admin · Layer 2 · RFC 6238 TOTP</div>

    <label for="email">E-Mail</label>
    <input id="email" type="email" placeholder="you@example.com" required />

    <label for="pass">Admin-Passwort</label>
    <input id="pass" type="password" placeholder="••••••••" required />

    <label for="token">6-stelliger Code</label>
    <input id="token" class="code" inputmode="numeric" maxlength="6" placeholder="000000" required />

    <button class="btn" id="verify" type="submit">Verifizieren</button>
    <button class="btn ghost" id="setup" type="button">2FA einrichten (Secret anzeigen)</button>

    <div class="msg" id="msg"></div>
    <div class="secret" id="secret"></div>
    <div class="foot"><a href="/admin">← zurück zum Dashboard</a></div>
  </form>

<script>
(function(){
  "use strict";
  const SUPABASE_URL="https://fnrwqovopebrluhmmgcu.supabase.co";
  const ANON="sb_publishable_TIS1Gm1foBW-frXrK4Tybg_i_95TVIa";
  const FN="https://fnrwqovopebrluhmmgcu.supabase.co/functions/v1/admin-auth";
  const $=id=>document.getElementById(id);
  const msg=(t,cls)=>{const m=$("msg");m.textContent=t;m.className="msg "+(cls||"");};

  async function call(action){
    const res=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json","apikey":ANON,"Authorization":"Bearer "+ANON},body:JSON.stringify({action,email:$("email").value.trim().toLowerCase(),password:$("pass").value,token:$("token").value.replace(/\D/g,"")})});
    return {status:res.status,data:await res.json().catch(()=>({}))};
  }

  $("f").addEventListener("submit",async(e)=>{
    e.preventDefault();
    const b=$("verify"); b.disabled=true; msg("Prüfe…");
    try{
      const {status,data}=await call("verify");
      if(status===200&&data.ok){ msg("✓ Erfolgreich verifiziert","ok"); setTimeout(()=>location.href="/admin",700); }
      else msg("✗ "+(data.error||"Fehler"),"err");
    }catch(err){ msg("✗ Netzwerkfehler","err"); }
    finally{ b.disabled=false; }
  });

  $("setup").addEventListener("click",async()=>{
    const s=$("secret"); s.style.display="block"; s.textContent="Lade…";
    try{
      const {status,data}=await call("setup-2fa");
      if(status===200&&data.secret){ s.textContent="Secret: "+data.secret+"  ·  "+data.otpauth; }
      else s.textContent="Fehler: "+(data.error||"unauthorized");
    }catch(err){ s.textContent="Netzwerkfehler"; }
  });
})();
</script>
</body>
</html>
